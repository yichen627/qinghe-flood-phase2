name: stage-2-quality
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=artifacts/junit.xml
      - name: Real HTTP services acceptance
        run: |
          docker compose up -d --build --wait api worker
          docker compose exec -T api python scripts/demo.py
          docker compose cp api:/app/artifacts ./docker-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-test-evidence
          path: |
            artifacts/
            docker-artifacts/
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
